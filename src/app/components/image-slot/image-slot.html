@if (src) {
  <img
    [src]="src"
    [alt]="alt"
    class="image-slot__img"
    [class.image-slot__img--circle]="shape === 'circle'"
    [attr.loading]="priority ? null : 'lazy'"
    [attr.fetchpriority]="priority ? 'high' : null"
  />
} @else if (kind === 'screenshot') {
  <div class="image-slot__wireframe" role="img" [attr.aria-label]="alt">
    <div class="image-slot__wireframe-bar">
      <span></span><span></span><span></span>
      <div class="image-slot__wireframe-address"></div>
    </div>
    <div class="image-slot__wireframe-body">
      <div class="image-slot__wireframe-row">
        <div class="image-slot__wireframe-block image-slot__wireframe-block--sm"></div>
        <div class="image-slot__wireframe-block image-slot__wireframe-block--sm"></div>
        <div class="image-slot__wireframe-block image-slot__wireframe-block--sm"></div>
      </div>
      <div class="image-slot__wireframe-row">
        <div class="image-slot__wireframe-block image-slot__wireframe-block--lg"></div>
        <div class="image-slot__wireframe-block image-slot__wireframe-block--md"></div>
      </div>
      <div class="image-slot__wireframe-lines">
        <div class="image-slot__wireframe-line" style="width: 88%"></div>
        <div class="image-slot__wireframe-line" style="width: 62%"></div>
        <div class="image-slot__wireframe-line" style="width: 74%"></div>
      </div>
    </div>
    <p class="image-slot__caption">
      <i class="fa-solid fa-camera" aria-hidden="true"></i>{{ label }}
    </p>
  </div>
} @else {
  <div class="image-slot__portrait" [class.image-slot__portrait--circle]="shape === 'circle'" role="img" [attr.aria-label]="alt">
    <i class="fa-solid fa-user" aria-hidden="true"></i>
    <p class="image-slot__caption">{{ label }}</p>
  </div>
}
