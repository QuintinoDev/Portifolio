<nav class="navbar">
  <a href="#home" class="navbar__brand">
    <span class="navbar__monogram">JV</span>
    <span class="navbar__identity">
      <span class="navbar__name">João Victor</span>
      <span class="navbar__role">FULL STACK · ARQUITETO</span>
    </span>
  </a>

  <div class="navbar__links">
    @for (link of navLinks; track link.href) {
      <a [href]="link.href">{{ link.label }}</a>
    }
    <a href="#contato" class="navbar__cta btn btn-primary">Vamos conversar</a>
  </div>

  <button
    type="button"
    class="navbar__toggle"
    [attr.aria-expanded]="mobileOpen()"
    aria-controls="mobile-menu"
    aria-label="Abrir menu de navegação"
    (click)="toggleMobile()"
  >
    <i class="fa-solid" [class.fa-bars]="!mobileOpen()" [class.fa-xmark]="mobileOpen()" aria-hidden="true"></i>
  </button>
</nav>

<div id="mobile-menu" class="mobile-menu" [class.mobile-menu--open]="mobileOpen()">
  @for (link of navLinks; track link.href) {
    <a [href]="link.href" (click)="closeMobile()">{{ link.label }}</a>
  }
  <a href="#contato" class="mobile-menu__cta" (click)="closeMobile()">Vamos conversar</a>
</div>
